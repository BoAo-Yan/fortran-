<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FORTRAN · 整段程序注释训练</title>
<style>
  :root{
    --bg:#060a11;--panel:rgba(11,19,30,.78);--line:rgba(56,189,248,.20);
    --txt:#c9dcea;--dim:#6d8ba1;--cyan:#22d3ee;--ok:#34d399;--bad:#fb7185;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:24px 16px 80px;color:var(--txt);
    font:15px/1.7 ui-sans-serif,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(900px 460px at 50% -12%, rgba(34,211,238,.15), transparent 62%),
      repeating-linear-gradient(0deg, rgba(56,189,248,.045) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(90deg, rgba(56,189,248,.045) 0 1px, transparent 1px 34px),
      var(--bg);
    background-attachment:fixed;
  }
  .wrap{max-width:900px;margin:0 auto}
  h1{font-size:19px;margin:0 0 6px;font-weight:600;letter-spacing:1px;color:#e6f6ff}
  h1 .sys{font-size:11px;letter-spacing:2px;color:var(--cyan);border:1px solid rgba(34,211,238,.5);
    border-radius:4px;padding:2px 7px;margin-right:10px;vertical-align:3px}
  .status{font-size:12px;color:var(--dim);margin:0 0 20px;letter-spacing:.4px}
  .status i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);
    box-shadow:0 0 8px var(--ok);margin-right:6px;vertical-align:1px}
  nav{display:flex;gap:10px;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:20px}
  nav button{font:inherit;font-size:14px;padding:7px 16px;background:transparent;color:var(--dim);
    border:1px solid var(--line);border-radius:6px;cursor:pointer;letter-spacing:.5px}
  nav button:hover{color:var(--cyan);border-color:rgba(34,211,238,.5)}
  nav button.on{color:#03141a;background:var(--cyan);border-color:var(--cyan);font-weight:600}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
  .meta{font-size:12px;color:var(--dim);letter-spacing:.4px;margin-bottom:12px}
  .meta b{color:var(--cyan);font-weight:600}
  .blk{border-radius:6px;margin:0 0 2px}
  .row{display:flex;align-items:baseline;gap:10px;padding:2px 6px;
    font:13px/1.62 "Cascadia Mono",Consolas,"Courier New",monospace;border-radius:5px}
  .row .no{color:#3a566b;width:2.1em;text-align:right;flex:none;user-select:none}
  .row .src{white-space:pre;color:#b6cfe1}
  .blk.key .row{background:rgba(34,211,238,.07);border-left:2px solid var(--cyan)}
  .blk.key .row .src{color:#d7f4fb}
  .tag{font-size:10px;letter-spacing:1px;color:#06222b;background:var(--cyan);
    border-radius:3px;padding:1px 5px;flex:none;font-family:inherit}
  .qline{display:flex;gap:8px;margin:4px 0 10px 3.2em}
  input{flex:1;font:13.5px/1.6 inherit;color:#dff3ff;background:rgba(4,10,18,.85);
    border:1px solid rgba(56,189,248,.20);border-radius:5px;padding:6px 10px;outline:none}
  input:focus{border-color:rgba(34,211,238,.6);box-shadow:0 0 0 2px rgba(34,211,238,.10)}
  input::placeholder{color:#3a566b}
  .btn{font:13px/1 inherit;padding:7px 13px;border-radius:5px;cursor:pointer;white-space:nowrap;
    background:transparent;color:#8fd8ec;border:1px solid rgba(34,211,238,.42)}
  .btn:hover{background:rgba(34,211,238,.12)}
  .btn.main{background:rgba(34,211,238,.14);color:#bdeffb;border-color:rgba(34,211,238,.6)}
  .res{font-size:12.5px;margin:0 0 10px 3.2em;line-height:1.7;display:none}
  .res.show{display:block}
  .res .ok{color:var(--ok)}.res .no{color:var(--bad)}
  .res .ref{color:#8fb0c6;display:block}
  .res .hit{color:#6f8fa5;font-size:12px;display:block}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;
    border-top:1px dashed rgba(56,189,248,.16);padding-top:14px}
  .bar label{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:6px;cursor:pointer}
  .score{margin-left:auto;font-size:13px;color:var(--dim)}
  .score b{color:var(--cyan);font-size:15px}
  .hide{display:none}
  .foot{margin-top:30px;text-align:center;font-size:12px;color:#3f5c72}
  .card.q .qtext{font-size:15.5px;margin:4px 0 2px;color:#e2f2fb}
  .self{display:flex;gap:8px;margin-top:10px}
  .card.self-ok{border-color:rgba(52,211,153,.55)}
  .card.self-bad{border-color:rgba(251,113,133,.55)}
  pre{background:#080f19;border:1px solid rgba(56,189,248,.14);border-radius:7px;padding:12px 14px;
    overflow:auto;font:12.5px/1.6 "Cascadia Mono",Consolas,monospace;color:#bcd4e6}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="sys">SYS</span>FORTRAN · 整段程序注释训练</h1>
  <p class="status"><i></i>ONLINE　31 段程序 / 389 个注释行（72 行精判）　判定：关键词匹配，不看字数看说没说到点子上</p>

  <nav>
    <button id="t1" class="on" onclick="mode(1)">01 · 逐行注释</button>
    <button id="t2" onclick="mode(2)">02 · 抽 4 题手写</button>
  </nav>

  <section id="s1">
    <div class="card">
      <div class="meta" id="m1"></div>
      <div id="body"></div>
      <div class="bar">
        <button class="btn main" onclick="judgeAll()">全部判定</button>
        <button class="btn" onclick="next()">换一段</button>

      </div>

    </div>
    <div id="list"></div>
  </section>

  <p class="foot">题面与标准答案取自 E:\Fortran_Lab\work\report*　·　离线单文件</p>
</div>

<script>
const DATA = [{"id": "report1/r1_1", "rep": 1, "no": "1", "title": "算术表达式", "q": "计算 x·sin(x)·ln(x) − e^(−y) + |z|·z^(1/2) + 2/(h³−5)，分别取 x=y=z=h=1 与 x=y=z=h=2。", "pts": ["整题就是「数学式子翻译成 Fortran」：乘号不能省，写成 x*sin(x)*log(x)。", "log(x) 是<b>自然对数 ln x</b>（不是 log10）；log10 才是以 10 为底。", "exp(-y) 表示 e^(−y)；abs(z) 取绝对值；sqrt(z) 开方（也可写 z**0.5）。", "h**3 是乘方，<b>不是 ^</b>。", "分母 (h**3 - 5.0) 必须整体加括号，否则变成 2/h³ − 5。", "结果：全 1 → 0.132121；全 2 → 4.620312。"], "code": "! 报告一 题1：计算 x*sin(x)*ln(x) - e^(-y) + |z|*sqrt(z) + 2/(h^3-5)\nprogram r1_1\n    implicit none\n    real x, y, z, h, f\n\n    x = 1.0\n    y = 1.0\n    z = 1.0\n    h = 1.0\n    f = x*sin(x)*log(x) - exp(-y) + abs(z)*sqrt(z) + 2.0/(h**3 - 5.0)\n    print *, 'x=1, y=1, z=1, h=1  ->  f =', f\n\n    x = 2.0\n    y = 2.0\n    z = 2.0\n    h = 2.0\n    f = x*sin(x)*log(x) - exp(-y) + abs(z)*sqrt(z) + 2.0/(h**3 - 5.0)\n    print *, 'x=2, y=2, z=2, h=2  ->  f =', f\nend", "quiz": [{"no": 1, "raw": "program r1_1", "ask": false}, {"no": 2, "raw": "implicit none", "ask": true, "key": true, "ref": "关闭隐式类型：所有变量必须先声明，否则编译报错", "kw": ["隐式", "声明", "先声明", "严格"], "need": 1}, {"no": 3, "raw": "real x, y, z, h, f", "ask": true, "key": false, "ref": "类型说明语句：声明变量（或常量）及其类型", "kw": ["声明", "定义", "变量", "类型"], "need": 1}, {"no": 4, "raw": "", "ask": false}, {"no": 5, "raw": "x = 1.0", "ask": true, "key": false, "ref": "赋值语句：把等号右边的计算结果存进左边变量", "kw": ["赋值", "计算", "存", "得到", "求"], "need": 1}, {"no": 6, "raw": "y = 1.0", "ask": true, "key": false, "ref": "赋值语句：把等号右边的计算结果存进左边变量", "kw": ["赋值", "计算", "存", "得到", "求"], "need": 1}, {"no": 7, "raw": "z = 1.0", "ask": true, "key": false, "ref": "赋值语句：把等号右边的计算结果存进左边变量", "kw": ["赋值", "计算", "存", "得到", "求"], "need": 1}, {"no": 8, "raw": "h = 1.0", "ask": true, "key": false, "ref": "赋值语句：把等号右边的计算结果存进左边变量", "kw": ["赋值", "计算", "存", "得到", "求"], "need": 1}, {"no": 9, "raw": "f = x*sin(x)*log(x) - exp(-y) + abs(z)*sqrt(z) + 2.0/(h**3 - 5.0)", "ask": true, "key": true, "ref": "数学式逐项翻译成 Fortran：log 是 ln、exp 是 e 的幂、** 是乘方、分母要整体加括号", "kw": ["log", "ln", "exp", "sqrt", "乘方", "括号", "翻译"], "need": 2}, {"no": 10, "raw": "print *, 'x=1, y=1, z=1, h=1  ->  f =', f", "ask": true, "key": false, "ref": "输出到屏幕（表控格式）", "kw": ["输出", "打印", "屏幕", "显示"], "need": 1}, {"no": 11, "raw": "", "ask": false}, {"no": 12, "raw": "x = 2.0", "ask": true, "key": true, "ref": "换第二组数据再算一次，顺序结构重复执行", "kw": ["第二组", "重新赋值", "再算"], "need": 1}, {"no": 13, "raw": "y = 2.0", "ask": true, "key": false, "ref": "赋值语句：把等号右边的计算结果存进左边变量", "kw": ["赋值", "计算", "存", "得到", "求"], "need": 1}, {"no": 14, "raw": "z = 2.0", "ask": true, "key": false, "ref": "赋值语句：把等号右边的计算结果存进左边变量", "kw": ["赋值", "计算", "存", "得到", "求"], "need": 1}, {"no": 15, "raw": "h = 2.0", "ask": true, "key": false, "ref": "赋值语句：把等号右边的计算结果存进左边变量", "kw": ["赋值", "计算", "存", "得到", "求"], "need": 1}, {"no": 16, "raw": "f = x*sin(x)*log(x) - exp(-y) + abs(z)*sqrt(z) + 2.0/(h**3 - 5.0)", "ask": true, "key": false, "ref": "赋值语句：把等号右边的计算结果存进左边变量", "kw": ["赋值", "计算", "存", "得到", "求"], "need": 1}, {"no": 17, "raw": "print *, 'x=2, y=2, z=2, h=2  ->  f =', f", "ask": true, "key": false, "ref": "输出到屏幕（表控格式）", "kw": ["输出", "打印", "屏幕", "显示"], "need": 1}, {"no": 18, "raw": "end", "ask": false}], "nask": 14, "nkey": 3}, {"id": "report1/r1_2", "rep": 1, "no": "2", "title": "三角形面积", "q": "已知三角形两边长 2 m、1 m，夹角 30°，求面积 S = (1/2)·a·b·sin C（输出到屏幕）。", "pts": ["sin/cos 的参数是<b>弧度</b>，30° 必须写 30.0*3.14159265/180.0。", "直接写 sin(30) 会被当成 30 弧度（约 1719°），结果错但不报错。", "S = 0.5*2*1*sin(30°) = <b>0.5 m²</b>。"], "code": "! 报告一 题2：已知三角形两边 2m、1m，夹角 30 度，求面积 S = (1/2)ab*sin(C)\nprogram r1_2\n    implicit none\n    real a, b, c, s, pi\n\n    pi = 3.14159265\n    a  = 2.0\n    b  = 1.0\n    c  = 30.0*pi/180.0\n    s  = 0.5*a*b*sin(c)\n    print *, '三角形面积 S =', s, ' m^2'\nend", "quiz": [{"no": 1, "raw": "program r1_2", "ask": false}, {"no": 2, "raw": "implicit none", "ask": true, "key": false, "ref": "关闭隐式类型：所有变量必须先声明，否则编译报错", "kw": ["隐式", "声明", "先声明", "严格"], "need": 1}, {"no": 3, "raw": "real a, b, c, s, pi", "ask": true, "key": false, "ref": "类型说明语句：声明变量（或常量）及其类型", "kw": ["声明", "定义", "变量", "类型"], "need": 1}, {"no": 4, "raw": "", "ask": false}, {"no": 5, "raw": "pi = 3.14159265", "ask": true, "key": true, "ref": "Fortran 没有内置 π，要自己定义", "kw": ["pi", "π", "定义", "圆周率"], "need": 1}, {"no": 6, "raw": "a  = 2.0", "ask": true, "key": false, "ref": "赋值语句：把等号右边的计算结果存进左边变量", "kw": ["赋值", "计算", "存", "得到", "求"], "need": 1}, {"no": 7, "raw": "b  = 1.0", "ask": true, "key": false, "ref": "赋值语句：把等号右边的计算结果存进左边变量", "kw": ["赋值", "计算", "存", "得到", "求"], "need": 1}, {"no": 8, "raw": "c  = 30.0*pi/180.0", "ask": true, "key": true, "ref": "把角度换算成弧度——三角函数只认弧度", "kw": ["弧度", "度", "换算", "角度", "180"], "need": 2}, {"no": 9, "raw": "s  = 0.5*a*b*sin(c)", "ask": true, "key": true, "ref": "三角形面积公式 S = ½ab·sinC", "kw": ["面积", "公式", "sin", "0.5", "二分之一"], "need": 2}, {"no": 10, "raw": "print *, '三角形面积 S =', s, ' m^2'", "ask": true, "key": false, "ref": "输出到屏幕（表控格式）", "kw": ["输出", "打印", "屏幕", "显示"], "need": 1}, {"no": 11, "raw": "end", "ask": false}], "nask": 8, "nkey": 3}, {"id": "report1/r1_3", "rep": 1, "no": "3", "title": "拉杆伸长量", "q": "受拉直杆 L=1 m，横截面为半径 0.01 m 的圆，E=210 GPa，F=1 kN，求伸长量 ΔL = F·L/(E·A)。", "pts": ["A = πr²，用<b>半径</b>：a = pi*r*r。", "单位换算：E=210 GPa → 210.0e9；F=1 kN → 1000.0。", "ΔL = <b>1.5158×10⁻⁵ m = 0.01516 mm</b>。"], "code": "! 报告一 题3：受拉直杆伸长量 dL = F*L/(E*A)，A = pi*r^2\nprogram r1_3\n    implicit none\n    real F, l, r, E, A, dl, pi\n\n    pi = 3.14159265\n    F  = 1000.0\n    l  = 1.0\n    r  = 0.01\n    E  = 210.0e9\n    A  = pi*r*r\n    dl = F*l/(E*A)\n    print *, 'F =', F, ' N'\n    print *, '杆的伸长量 dL =', dl, ' m'\n    print *, '              =', dl*1000.0, ' mm'\nend", "quiz": [{"no": 1, "raw": "program r1_3", "ask": false}, {"no": 2, "raw": "implicit none", "ask": true, "key": false, "ref": "关闭隐式类型：所有变量必须先声明，否则编译报错", "kw": ["隐式", "声明", "先声明", "严格"], "need": 1}, {"no": 3, "raw": "real F, l, r, E, A, dl, pi", "ask": true, "key": false, "ref": "类型说明语句：声明变量（或常量）及其类型", "kw": ["声明", "定义", "变量", "类型"], "need": 1}, {"no": 4, "raw": "", "ask": false}, {"no": 5, "raw": "pi = 3.14159265", "ask": true, "key": false, "ref": "赋值语句：把等号右边的计算结果存进左边变量", "kw": ["赋值", "计算", "存", "得到", "求"], "need": 1}, {"no": 6, "raw": "F  = 1000.0", "ask": true, "key": false, "ref": "赋值语句：把等号右边的计算结果存进左边变量", "kw": ["赋值", "计算", "存", "得到", "求"], "need": 1}, {"no": 7, "raw": "l  = 1.0", "ask": true, "key": false, "ref": "赋值语句：把等号右边的计算结果存进左边变量", "kw": ["赋值", "计算", "存", "得到", "求"], "need": 1}, {"no": 8, "raw": "r  = 0.01", "ask": true, "key": false, "ref": "赋值语句：把等号右边的计算结果存进左边变量", "kw": ["赋值", "计算", "存", "得到", "求"], "need": 1}, {"no": 9, "raw": "E  = 210.0e9", "ask": true, "key": true, "ref": "弹性模量 210 GPa 换算成 Pa（国际单位）", "kw": ["gpa", "单位", "210", "e9", "pa", "换算"], "need": 2}, {"no": 10, "raw": "A  = pi*r*r", "ask": true, "key": true, "ref": "圆截面积 A = πr²，r 是半径", "kw": ["面积", "半径", "π", "r"], "need": 1}, {"no": 11, "raw": "dl = F*l/(E*A)", "ask": true, "key": true, "ref": "胡克定律：伸长量 ΔL = FL/(EA)", "kw": ["胡克", "伸长", "公式", "fl", "ea"], "need": 2}, {"no": 12, "raw": "print *, 'F =', F, ' N'", "ask": true, "key": false, "ref": "输出到屏幕（表控格式）", "kw": ["输出", "打印", "屏幕", "显示"], "need": 1}, {"no": 13, "raw": "print *, '杆的伸长量 dL =', dl, ' m'", "ask": true, "key": false, "ref": "输出到屏幕（表控格式）", "kw": ["输出", "打印", "屏幕", "显示"], "need": 1}, {"no": 14, "raw": "print *, '              =', dl*1000.0, ' mm'", "ask": true, "key": false, "ref": "输出到屏幕（表控格式）", "kw": ["输出", "打印", "屏幕", "显示"], "need": 1}, {"no": 15, "raw": "end", "ask": false}], "nask": 12, "nkey": 3}, {"id": "report1/r1_4", "rep": 1, "no": "4·5", "title": "抗弯截面系数", "q": "计算圆形截面抗弯截面系数（d=10 cm）与矩形截面抗弯截面系数（b=2 cm, h=4 cm）。", "pts": ["圆形 W = πd³/32，<b>d 是直径</b>；若只给半径 r，则 W = πr³/4（(2r)³=8r³）。", "矩形 W = b·h²/6，是<b>高度平方</b>，不是 b²h。", "结果：圆 <b>98.17 cm³</b>，矩形 <b>5.33 cm³</b>。", "抗扭是抗弯的 2 倍（Wp=πd³/16），别混。"], "code": "! 报告一 题4、题5：抗弯截面系数\n!   圆形截面 W = pi*d^3/32      矩形截面 W = b*h^2/6\nprogram r1_4\n    implicit none\n    real d, w1, b, h, w2, pi\n\n    pi "分式表达式", "q": "输入 x、y，计算 f = ln(x²+y)/(sin²(xy)+1) + 32。", "pts": ["log(x*x + y)：要求 x²+y&gt;0，否则对数无定义。", "sin(x*y)**2 是「先 sin 再平方」，<b>不是</b> sin((xy)²)。", "+32 在分式<b>外面</b>：log(...)/(sin(...)**2 + 1.0) + 32.0。", "x=y=1 → <b>32.4058</b>。"], "code": "! 报告二 题1：输入 x、y，计算 f = ln(x^2+y)/(sin^2(xy)+1) + 32\nprogram r2_1\n    implicit none\n    real x, y, f\n\n    print *, '请输入 x 和 y：'\n    read *, x, y\n    f = log(x*x + y)/(sin(x*y)**2 + 1.0) + 32.0\n    print *, 'f =', f\nend", "quiz": [{"no": 1, "raw": "program r2_1", "ask": false}, {"no": 2, "raw": "implicit none", "ask": true, "key": false, "ref": "关闭隐式类型：所有变量必须先声明，否则编译报错", "kw": ["隐式", "声明", "先声明", "严格"], "need": 1}, {"no": 3, "raw": "real x, y, f", "ask": true, "key": false, "ref": "类型说明语句：声明变量（或常量）及其类型", "kw": ["声明", "定义", "变量", "类型"], "need": 1}, {"no": 4, "raw": "", "ask": false}, {"no": 5, "raw": "print *, '请输入 x 和 y：'", "ask": true, "key": false, "ref": "输出到屏幕（表控格式）", "kw": ["输出", "打印", "屏幕", "显示"], "need": 1}, {"no": 6, "raw": "read *, x, y", "ask": true, "key": true, "ref": "表控格式从键盘一次读入 x、y", "kw": ["读入", "键盘", "表控", "一次"], "need": 1}, {"no": 7, "raw": "f = log(x*x + y)/(sin(x*y)**2 + 1.0) + 32.0", "ask": true, "key": true, "ref": "log 是自然对数 ln；sin(x*y)**2 是先 sin 再平方；+32 在分式外", "kw": ["log", "ln", "sin", "平方", "分式", "括号"], "need": 2}, {"no": 8, "raw": "print *, 'f =', f", "ask": true, "key": false, "ref": "输出到屏幕（表控格式）", "kw": ["输出", "打印", "屏幕", "显示"], "need": 1}, {"no": 9, "raw": "end", "ask": false}], "nask": 6, "nkey": 2}, {"id": "report2/r2_2", "rep": 2, "no": "2", "title": "三数均值与极值", "q": "输入三个实数，输出它们的平均值、最大值、最小值。", "pts": ["max(x,y,z) / min(x,y,z) 是内部函数，<b>可直接给 3 个参数</b>，不用写 if。", "平均值 (x+y+z)/3.0。", "3.5, −2, 7.25 → 平均 2.9167，最大 7.25，最小 −2。"], "code": "! 报告二 题2：输入三个实数，求平均值、最大值、最小值\nprogram r2_2\n    implicit none\n    real x, y, z\n\n    print *, '请输入三个实数 x、y、z：'\n    read *, x, y, z\n    print *, '平均值 =', (x + y + z)/3.0\n    print *, '最大值 =', max(x, y, z)\n    print *, '最小值 =', min(x, y, z)\nend", "quiz": [{"no": 1, "raw": "program r2_2", "ask": false}, {"no": 2, "raw": "implicit none", "ask": true, "key": false, "ref": "关闭隐式类型：所有变量必须先声明，否则编译报错", "kw": ["隐式", "声明", "先声明", "严格"], "need": 1}, {"no": 3, "raw": "real x, y, z", "ask": true, "key": false, "ref": "类型说明语句：声明变量（或常量）及其类型", "kw": ["声明", "定义", "变量", "类型"], "need": 1}, {"no": 4, "raw": "", "ask": false}, {"no": 5, "raw": "print *, '请输入三个实数 x、y、z：'", "ask": true, "key": false, "ref": "输出到屏幕（表控格式）", "kw": ["输出", "打印", "屏幕", "显示"], "need": 1}, {"no": 6, "raw": "read *, x, y, z", "ask": true, "key": false, "ref": "从键盘读入数据（表控格式，* 表示自由格式）", "kw": ["输入", "读入", "键盘", "读"], "need": 1}, {"no": 7, "raw": "print *, '平均值 =', (x + y + z)/3.0", "ask": true, "key": true, "ref": "平均值 = 三个数之和除以 3", "kw": ["平均", "和", "除"], "need": 1}, {"no": 8, "raw": "print *, '最大值 =', max(x, y, z)", "ask": true, "key": true, "ref": "内部函数 max 可以直接给三个参数取最大", "kw": ["max", "最大", "内部函数", "三个参数"], "need": 2}, {"no": 9, "raw": "print *, '最小值 =', min(x, y, z)", "ask": true, "key": true, "ref": "内部函数 min 取最小", "kw": ["min", "最小", "内部函数"], "need": 1}, {"no": 10, "raw": "end", "ask": false}], "nask": 7, "nkey": 3}, {"id": "report2/r2_3", "rep": 2, "no": "3", "title": "细杆转动惯量（平行轴定理）", "q": "匀质细杆长 L、质量 m，求绕任意垂直于杆轴转轴的转动惯量；并算 L=1 m、m=2 kg，距杆端 0.2/0.3/0.45 m 处。", "pts": ["平行轴定理 I = m·L²/12 + m·d²，d 是转轴到<b>质心</b>的距离。", "题目给的是到<b>杆端</b>的距离 a，所以 d = |L/2 − a|。", "结果：0.346667 / 0.246667 / 0.171667 kg·m²（绕质心最小，1/6≈0.1667）。"], "code": "! 报告二 题3：匀质细杆绕任意垂直于杆轴的转轴的转动惯量\n!   平行轴定理  I = m*L^2/12 + m*d^2 ，d 为转轴到杆质心的距离\n!   已知转轴到杆端的距离 a，则 d = |L/2 - a|\nprogram r2_3\n    implicit none\n    integer i\n    real l, m, a(3), d, iz\n\n    print *, '请输入杆长 L(m) 和质量 m(kg)：'\n    read *, l, m\n    print *, '请输入三个转轴到杆端的距离 a(m)：'\n    read *, a\n\n    do i = 1, 3\n        d  = abs(l/2.0 - a(i))\n        iz = m*l**2/12.0 + m*d**2\n        print *, 'a =', a(i), ' m  ->  d =', d, ' m ,  I =', iz, ' kg*m^2'\n    end do\nend", "quiz": [{"no": 1, "raw": "program r2_3", "ask": false}, {"no": 2, "raw": "implicit none", "ask": true, "key": false, "ref": "关闭隐式类型：所有变量必须先声明，否则编译报错", "kw": ["隐式", "声明", "先声明", "严格"], "need": 1}, {"no": 3, "raw": "integer i", "ask": true, "key": false, "ref": "类型说明语句：声明变量（或常量）及其类型", "kw": ["声明", "定义", "变量", "类型"], "need": 1}, {"no": 4, "raw": "real l, m, a(3), d, iz", "ask": true, "key": false, "ref": "类型说明语句：声明变量（或常量）及其类型", "kw": ["声明", "定义", "变量", "类型"], "need": 1}, {"no": 5, "raw": "", "ask": false}, {"no": 6, "raw": "print *, '请输入杆长 L(m) 和质量 m(kg)：'", "ask": true, "key": false, "ref": "输出到屏幕（表控格式）", "kw": ["输出", "打印", "屏幕", "显示"], "need": 1}, {"no": 7, "raw": "read *, l, m", "ask": true, "key": false, "ref": "从键盘读入数据（表控格式，* 表示自由格式）", "kw": ["输入", "读入", "键盘", "读"], "need": 1}, {"no": 8, "raw": "print *, '请输入三个转轴到杆端的距离 a(m)：'", "ask": true, "key": false, "ref": "输出到屏幕（表控格式）", "kw": ["输出", "打印", "屏幕", "显示"], "need": 1}, {"no": 9, "raw": "read *, a", "ask": true, "key": true, "ref": "整个数组一次读入三个距离", "kw": ["数组", "一次", "读入"], "need": 1}, {"no": 10, "raw": "", "ask": false}, {"no": 11, "raw": "do i = 1, 3", "ask": true, "key": false, "ref": "do 循环开始：i = 1, 3（步长默认 1）", "kw": ["循环", "do", "遍历", "重复"], "need": 1}, {"no": 12, "raw": "d  = abs(l/2.0 - a(i))", "ask": true, "key": true, "ref": "转轴到质心的距离 d = |L/2 − a|", "kw": ["质心", "距离", "绝对值", "l/2"], "need": 2}, {"no": 13, "raw": "iz = m*l**2/12.0 + m*d**2", "ask": true, "key": true, "ref": "平行轴定理 I = mL²/12 + md²", "kw": ["平行轴", "定理", "转动惯量", "md", "ml"], "need": 2}, {"no": 14, "raw": "print *, 'a =', a(i), ' m  ->  d =', d, ' m ,  I =', iz, ' kg*m^2'", "ask": true, "key": false, "ref": "输出到屏幕（表控格式）", "kw": ["输出", "打印", "屏幕", "显示"], "need": 1}, {"no": 15, "raw": "end do", "ask": true, "key": false, "ref": "循环体结束，控制回到 do 语句", "kw": ["循环", "结束", "回到"], "need": 1}, {"no": 16, "raw": "end", "ask": false}], "nask": 12, "nkey": 3}, {"id": "report3/r3_1", "rep": 3, "no": "1", "title": "压杆临界力", "q": "输入弹性模量 E、圆截面直径 d、长度系数 μ、杆长 L，求理想圆截面压杆的临界力。", "pts": ["I = πd⁴/64；Fcr = π²EI/(μL)²。", "分母括号 (mu*l)**2：写成 mu*l**2 就变成 μ·L²，差 μ 倍。", "E=2.06e11, d=0.05, μ=1, L=1 → I=3.068e−7 m⁴，Fcr≈<b>6.24×10⁵ N</b>。"], "code": "! 报告三 题1：理想圆截面压杆的临界力  Fcr = pi^2*E*I/(mu*L)^2 ，I = pi*d^4/64\nprogram r3_1\n    implicit none\n    real e, d, mu, l, iz, fcr, pi\n\n    pi = 3.14159265\n    print *, '请输入弹性模量 E(Pa)、圆截面直径 d(m)、长度系数 mu、杆长 L(m)：'\n    read *, e, d, mu, l\n    iz  = pi*d**4/64.0\n    fcr = pi**2*e*iz/(mu*l)**2\n    print *, '惯性矩 I   =', iz, ' m^4'\n    print *, '临界力 Fcr =', fcr, ' N'\nend", "quiz": [{"no": 1, "raw": "program r3_1", "ask": false}, {"no": 2, "raw": "implicit none", "ask": true, "key": false, "ref": "关闭隐式类型：所有变量必须先声明，否则编译报错", "kw": ["隐式", "声明", "先声明", "严格"], "need": 1}, {"no": 3, "raw": "real e, d, mu, l, iz, fcr, pi", "ask": true, "key": false, "ref": "类型说明语句：声明变量（或常量）及其类型", "kw": ["声明", "定义", "变量", "类型"], "need": 1}, {"no": 4, "raw": "", "ask": false}, {"no": 5, "raw": "pi = 3.14159265", "ask": true, "key": false, "ref": "赋值语句：把等号右边的计算结果存进左边变量", "kw": ["赋值", "计算", "存", "得到", "求"], "need": 1}, {"no": 6, "raw": "print *, '请输入弹性模量 E(Pa)、圆截面直径 d(m)、长度系数 mu、杆长 L(m)：'", "ask": true, "key": false, "ref": "输出到屏幕（表控格式）", "kw": ["输出", "打印", "屏幕", "显示"], "need": 1}, {"no": 7, "raw": "read *, e, d, mu, l", "ask": true, "key": false, "ref": "从键盘读入数据（表控格式，* 表示自由格式）", "kw": ["输入", "读入", "键盘", "读"], "need": 1}, {"no": 8, "raw": "iz  = pi*d**4/64.0", "ask": true, "key": true, "ref": "圆截面惯性矩 I = πd⁴/64（四次方，不是三次方）", "kw": ["惯性矩", "四次方", "64", "直径", "d^4"], "need": 2}, {"no": 9, "raw": "fcr = pi**2*e*iz/(mu*l)**2", "ask": true, "key": true, "ref": "欧拉临界力；分母 (μL)² 要整体平方", "kw": ["欧拉", "临界力", "括号", "平方", "μl"], "need": 2}, {"no": 10, "raw": "print *, '惯性矩 I   =', iz, ' m^4'", "ask": true, "key": false, "ref": "输出到屏幕（表控格式）", "kw": ["输出", "打印", "屏幕", "显示"], "need": 1}, {"no": 11, "raw": "print *, '临界力 Fcr =', fcr, ' N'", "ask": true, "key": false, "ref": "输出到屏幕（表控格式）", "kw": ["输出", "打印", "屏幕", "显示"], "need": 1}, {"no": 12, "raw": "end", "ask": false}], "nask": 9, "nkey": 2}, {"id": "report3/r3_2", "rep": 3, "no": "2", "title": "矩形最小惯性矩", "q": "输入矩形截面两个边长，计算该截面的最小惯性矩。", "pts": ["对两条形心主轴分别是 a·b³/12 与 b·a³/12，<b>短边的三次方那个更小</b>。", "max(a,b)*min(a,b)**3/12.0 一行搞定。", "a=4, b=2 → <b>2.6667</b>。"], "code": "! 报告三 题2：矩形截面最小惯性矩  Imin = (长边)*(短边)^3/12\nprogram r3_2\n    implicit none\n    real a, b\n\n    print *, '请输入矩形截面的两个边长 a、b：'\n    read *, a, b\n    print *, '最小惯性矩 Imin =', max(a, b)*min(a, b)**3/12.0\nend", "quiz": [{"no": 1, "raw": "program r3_2", "ask": false}, {"no": 2, "raw": "implicit none", "ask": true, "key": false, "ref": "关闭隐式类型：所有变量必须先声明，否则编译报错", "kw": ["隐式", "声明", "先声明", "严格"], "need": 1}, {"no": 3, "raw": "real a, b", "ask": true, "key": false, "ref": "类型说明语句：声明变量（或常量）及其类型", "kw": ["声明", "定义", "变量", "类型"], "need": 1}, {"no": 4, "raw": "", "ask": false}, {"no": 5, "raw": "print *, '请输入矩形截面的两个边长 a、b：'", "ask": true, "key": false, "ref": "输出到屏幕（表控格式）", "kw": ["输出", "打印", "屏幕", "显示"], "need": 1}, {"no": 6, "raw": "read *, a, b", "ask": true, "key": false, "ref": "从键盘读入数据（表控格式，* 表示自由格式）", "kw": ["输入", "读入", "键盘", "读"], "need": 1}, {"no": 7, "raw": "print *, '最小惯性矩 Imin =', max(a, b)*min(a, b)**3/12.0", "ask": true, "key": true, "ref": "取长边 × 短边³ /12——短边的三次方才是最小惯性矩", "kw": ["短边", "三次方", "12", "最小"], "need": 2}, {"no": 8, "raw": "end", "ask": false}], "nask": 5, "nkey": 1}, {"id": "report3/r3_3", "rep": 3, "no": "3", "title": "数据压缩", "q": "已知 XMin=200、XMax=700，输入 X：X&lt;XMin 用 X 替换 XMin；X&gt;XMax 用 X 替换 XMax；否则 X=(X−XMin)/(XMax−XMin)。", "pts": ["三个分支<b>互斥</b>：if … else if … else … end if。", "不等于是 /=，不是 !=。", "X=450 → <b>0.5</b>；X=100 → XMin=100；X=800 → XMax=800。"], "code": "! 报告三 题3：数据压缩  XMin=200，XMax=700\n!   X < XMin -> 用 X 替换 XMin；X > XMax -> 用 X 替换 XMax；\n!   否则     -> X = (X - XMin)/(XMax - XMin)，压缩到 0~1\nprogram r3_3\n    implicit none\n    real xmin, xmax, x\n\n    xmin = 200.0\n    xmax = 700.0\n    print *, '请输入 X：'\n    read *, x\n\n    if (x < xmin) then\n        xmin = x\n        print *, 'X < XMin，XMin 替换为', xmin\n    e ger i, j\n    real k(3, 3), s\n\n    k(1, :) = (/5.3,  2.3, -3.6/)\n    k(2, :) = (/2.3, -7.8,  2.3/)\n    k(3, :) = (/4.1,  2.6, -3.5/)\n\n    s = 0.0\n    do i = 1, 3\n        s = s + k(i, 4 - i)\n    end do\n    print '(a, f5.1)', '副对角线元素之和 =', s\n\n    do i = 1, 3\n        j = 4 - i\n        if (k(i, j) <= 0.0) print '(a, i2, a, i2, a, f6.1)', 'k(', i, ',', j, ') =', k(i, j)\n    end do\nend", "quiz": [{"no": 1, "raw": "program r6_2", "ask": false}, {"no": 2, "raw": "implicit none", "ask": true, "key": false, "ref": "关闭隐式类型：所有变量必须先声明，否则编译报错", "kw": ["隐式", "声明", "先声明", "严格"], "need": 1}, {"no": 3, "raw": "integer i, j", "ask": true, "key": false, "ref": "类型说明语句：声明变量（或常量）及其类型", "kw": ["声明", "定义", "变量", "类型"], "need": 1}, {"no": 4, "raw": "real k(3, 3), s", "ask": true, "key": false, "ref": "类型说明语句：声明变量（或常量）及其类型", "kw": ["声明", "定义", "变量", "类型"], "need": 1}, {"no": 5, "raw": "", "ask": false}, {"no": 6, "raw": "k(1, :) = (/5.3,  2.3, -3.6/)", "ask": true, "key": false, "ref": "赋值语句：把等号右边的计算结果存进左边变量", "kw": ["赋值", "计算", "存", "得到", "求"], "need": 1}, {"no": 7, "raw": "k(2, :) = (/2.3, -7.8,  2.3/)", "ask": true, "key": false, "ref": "赋值语句：把等号右边的计算结果存进左边变量", "kw": ["赋值", "计算", "存", "得到", "求"], "need": 1}, {"no": 8, "raw": "k(3, :) = (/4.1,  2.6, -3.5/)", "ask": true, "key": false, "ref": "赋值语句：把等号右边的计算结果存进左边变量", "kw": ["赋值", "计算", "存", "得到", "求"], "need": 1}, {"no": 9, "raw": "", "ask": false}, {"no": 10, "raw": "s = 0.0", "ask": true, "key": false, "ref": "赋值语句：把等号右边的计算结果存进左边变量", "kw": ["赋值", "计算", "存", "得到", "求"], "need": 1}, {"no": 11, "raw": "do i = 1, 3", "ask": true, "key": false, "ref": "do 循环开始：i = 1, 3（步长默认 1）", "kw": ["循环", "do", "遍历", "重复"], "need": 1}, {"no": 12, "raw": "s = s + k(i, 4 - i)", "ask": true, "key": true, "ref": "副对角线元素是 k(i, n+1−i)，3×3 时为 k(i,4−i)", "kw": ["副对角", "4-i", "n+1", "对角线"], "need": 2}, {"no": 13, "raw": "end do", "ask": true, "key": false, "ref": "循环体结束，控制回到 do 语句", "kw": ["循环", "结束", "回到"], "need": 1}, {"no": 14, "raw": "print '(a,  '正数：个数 =', np, ' ，和 =', sp\n    print *, '负数：个数 =', nn, ' ，和 =', sn\n    print *, '零：  个数 =', nz\nend\n\nsubroutine statis(a, np, sp, nn, sn, nz)\n    integer i, j, np, nn, nz\n    real a(5, 5), sp, sn\n\n    np = 0\n    nn = 0\n    nz = 0\n    sp = 0.0\n    sn = 0.0\n    do i = 1, 5\n        do j = 1, 5\n            if (a(i, j) > 0.0) then\n                np = np + 1\n                sp = sp + a(i, j)\n            else if (a(i, j) < 0.0) then\n                nn = nn + 1\n                sn = sn + a(i, j)\n            else\n                nz = nz + 1\n            end if\n        end do\n    end do\nend subroutine statis", "quiz": [{"no": 1, "raw": "program r7_5", "ask": false}, {"no": 2, "raw": "integer i, np, nn, nz", "ask": true, "key": false, "ref": "类型说明语句：声明变量（或常量）及其类型", "kw": ["声明", "定义", "变量", "类型"], "need": 1}, {"no": 3, "raw": "real a(5, 5), sp, sn", "ask": true, "key": false, "ref": "类型说明语句：声明变量（或常量）及其类型", "kw": ["声明", "定义", "变量", "类型"], "need": 1}, {"no": 4, "raw": "", "ask": false}, {"no": 5, "raw": "a(1, :) = (/1., -2., 0., 4., -5./)", "ask": true, "key": false, "ref": "赋值语句：把等号右边的计算结果存进左边变量", "kw": ["赋值", "计算", "存", "得到", "求"], "need": 1}, {"no": 6, "raw": "a(2, :) = (/6., 0., -7., 8., 9./)", "ask": true, "key": false, "ref": "赋值语句：把等号右边的计算结果存进左边变量", "kw": ["赋值", "计算", "存", "得到", "求"], "need": 1}, {"no": 7, "raw": "a(3, :) = (/-1., 2., 3., -4., 0./)", "ask": true, "key": false, "ref": "赋值语句：把等号右边的计算结果存进左边变量", "kw": ["赋值", "计算", "存", "得到", "求"], "need": 1}, {"no": 8, "raw": "a(4, :) = (/5., -6., 7., 0., -8./)", "ask": true, "key": false, "ref": "赋值语句：把等号右边的计算结果存进左边变量", "kw": ["赋值", "计算", "存", "得到", "求"], "need": 1}, {"no": 9, "raw": "a(5, :) = (/9., 1., -2., 3., 4./)", "ask": true, "key": false, "ref": "赋值语句：把等号右边的计算结果存进左边变量", "kw": ["赋值", "计算", "存", "得到", "求"], "need": 1}, {"no": 10, "raw": "", "ask": false}, {"no": 11, "raw": "print *, '数组 A：'", "ask": true, "key": false, "ref": "输出到屏幕（表控格式）", "kw": ["输出", "打印", "屏幕", "显示"], "need": 1}, {"no": 12, let cur=null, last=-1;

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function norm(x){return x.replace(/\s+/g,"").toLowerCase().replace(/[\s，,。.；;：:、（）()【】\[\]"'“”‘’]/g,"");}

function mode(k){
  document.getElementById("s1").classList.toggle("hide",k!==1);
  document.getElementById("s2").classList.toggle("hide",k!==2);
  document.getElementById("t1").classList.toggle("on",k===1);
  document.getElementById("t2").classList.toggle("on",k===2);
  if(k===1 && !cur) next();
}

function next(){

  cur.quiz.forEach(q=>q.ok=null);

    const row = '<div class="row"><span class="no">'+q.no+'</span><span class="src">'+esc(q.raw)+
                '</span>'+(q.key?'<span class="tag">CORE</span>':'')+'</div>';
    if(!q.ask) return '<div class="blk" id="b'+k+'">'+row+'</div>';
    return '<div class="blk '+(q.key?'key':'')+'" id="b'+k+'">'+row+
      '<div class="qline"><input id="i'+k+'" placeholder="注释这一行…" onkeydown="if(event.key===\'Enter\')judge('+k+')">'+
      '<button class="btn" onclick="judge('+k+')">判定</button></div>'+
      '<div class="res" id="r'+k+'"></div></div>';
  }).join("");
  document.getElementById("score").textContent = "— 未判定 —";
  document.getElementById("onlyKey").checked = false;
  const f = document.getElementById("i0"); if(f) f.focus();
}

function judge(k){
  const q = cur.quiz[k];
  const raw = (document.getElementById("i"+k).value||"").trim();
  const res = document.getElementById("r"+k);
  if(!raw){
    res.className="res show";
    res.innerHTML='<span class="no">✗</span> 先写点什么再判定。';
    return false;
  }
  const t = norm(raw);
  const hit = q.kw.filter(x => t.includes(norm(x)));
  const ok = hit.length >= q.need;
  q.ok = ok;
  res.className="res show";
  res.innerHTML = (ok?'<span class="ok">✓ 正确</span>':'<span class="no">✗ 没说到点子上</span>') +
    '　<span class="hit">命中：'+(hit.length?hit.join("、"):"（无）")+'　需 ≥'+q.need+' 个</span>' +
    '<span class="ref">参考：'+q.ref+'</span>';
  update();
  return ok;
}

function update(){
  const asked = cur.quiz.filter(q=>q.ask);
  const done = asked.filter(q=>q.ok===true||q.ok===false).length;
  const ok = asked.filter(q=>q.ok===true).length;
  const el = document.getElementById("score");
  if(!done){ el.textContent="— 未判定 —"; return; }
  el.innerHTML = '已注 <b>'+done+'</b>/'+cur.nask+'　正确 <b>'+ok+'</b>';
}
function judgeAll(){
  cur.quiz.forEach((q,k)=>{
    if(!q.ask) return;
    const el = document.getElementById("i"+k);
    if(el && (el.value||"").trim()) judge(k);
  });
}
function toggleKey(){
  const on = document.getElementById("onlyKey").checked;
  cur.quiz.forEach((q,k)=>{ if(!q.key) document.getElementById("b"+k).classList.toggle("hide",on); });
}

/* ---------- 题型二 ---------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let round=0;
function draw(){
  const by={}; DATA.forEach(d=>{(by[d.rep]=by[d.rep]||[]).push(d);});
  const reps = shuffle(Object.keys(by)).slice(0,4);
  const pick = reps.map(r=>by[r][Math.floor(Math.random()*by[r].length)]);
  round++;
  document.getElementById("hint").textContent = "第 "+round+" 轮："+pick.map(d=>"报告"+d.rep).join(" / ");
  document.getElementById("list").innerHTML = pick.map((d,i)=>`
    <div class="card q" id="c${i}">
      <div class="meta"><b>${i+1}</b>　报告 ${d.rep} · 第 ${d.no} 题　${d.title}</div>
      <div class="qtext">${d.q}</div>
      <div class="self">
        <button class="btn" onclick="rev(${i})">看标准答案</button>
        <button class="btn" onclick="mark(${i},1)">我写对了</button>
        <button class="btn" onclick="mark(${i},0)">没写对</button>
      </div>
      <div class="res" id="a${i}">
        <div style="margin:10px 0 6px;color:var(--dim);font-size:12px">标准程序</div>
        <pre>${d.code.split("\n").map((l,k)=>esc(l)).join("\n")}</pre>
        <div style="margin:8px 0 4px;color:var(--dim);font-size:12px">要点</div>
        <ul style="margin:0;padding-left:20px">${d.pts.map(p=>"<li>"+p+"</li>").join("")}</ul>
      </div>
    </div>`).join("");
}
function rev(i){document.getElementById("a"+i).classList.toggle("show");}
function mark(i,ok){
  const c=document.getElementById("c"+i);
  c.classList.remove("self-ok","self-bad");
  c.classList.add(ok?"self-ok":"self-bad");
}

next();
</script>
